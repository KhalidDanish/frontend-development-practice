<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>BMI calculator</title>

</head>
<body>
    <!-- contanier to diaply in the middle -->
    <div class="container">
        <div class="row">
            
            <input type="range"  id="wValue" max="150" value="0" >
            <span class="weight">0 KG</span>
        </div>
        <div class="row">
            <input type="range" id="hValue" max="250" value="0">
            <span class="height">0 CM</span>
        </div>
        <p class="result"></p>
        <p class="catagory"></p>
    </div>
    <script src="./app.js"></script>
</body>
</html>
